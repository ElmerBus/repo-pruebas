<!DOCTYPE html>
<html lang="es">

<head>
      <title>Iniciar Sesión</title>
      <script src="../JS/utilidad.js"></script>
      <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

      <div class="contenedor">
            <h1>Iniciar sesión</h1>

            <div class="grupo">
                  <label>Número de empleado o correo electrónico</label>

                  <div class="campo">
                        <input id="empleado" type="text">
                  </div>

            </div>

            <div class="grupo">
                  <label>Contraseña</label>

                  <div class="campo">
                        <input id="password" autocomplete="new-password" type="password" placeholder="••••••••">
                        <button type="button" class="btn-ver" onclick="verContrasena(document.getElementById('password'))">👁</button>
                  </div>
            </div>

            <div class="contRecuperacion">
                  <a href="PantallaOTP.html" class="link" onclick="return validarCampo(document.getElementById('empleado'))">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login" onclick="return validarCampo(document.getElementById('empleado')) && validarCampo(document.getElementById('password'));">Iniciar sesión</button>
      </div>

</body>

</html>
