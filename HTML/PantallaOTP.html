<!doctype html>
<html>
<head>
      <title>Verificación de código</title>
      <link rel="stylesheet" href="../CSS/pantallaotp.css">

</head>

<body>
      <div class="contenedor">
            <h1>Verificación de código</h1>
            <p>Por favor, ingresa el código de seguridad de 6 dígitos que enviamos a tu correo electrónico:</p>

            <!-- Campos para los 6 dígitos -->
            <div class="codigo">
                  <input type="text" maxlength="1">
                  <input type="text" maxlength="1">
                  <input type="text" maxlength="1">
                  <input type="text" maxlength="1">
                  <input type="text" maxlength="1">
                  <input type="text" maxlength="1">
            </div>

            <!-- Botón de verificación -->
            <button id="btnVerificar" disabled>Verificar</button>

            <p>¿No recibiste el código? Revisa tu carpeta de spam.</p>
      </div>

      <!-- Conectamos el JavaScript -->
      <script>
            // Seleccionamos todos los cuadros de código
            const inputs = document.querySelectorAll('.codigo input');
            const boton = document.getElementById('btnVerificar');

            // Auto-enfoque en el primer cuadro
            inputs[0].focus();

            // Escuchar cada cuadro
            inputs.forEach((input, index) => {
                  input.addEventListener('input', () => {
                        // Si el usuario escribe algo, pasa al siguiente cuadro
                        if (input.value && index < inputs.length - 1) { inputs[index + 1].focus(); }
                        // Verificar si todos los      cuadros están llenos 
                        let codigoCompleto = true; inputs.forEach(i => {
                              if (i.value === '') codigoCompleto = false;
                        });

                        // Habilitar el botón si el código está completo
                        boton.disabled = !codigoCompleto;
                  });
            });

      </script>
</body>

</html>
