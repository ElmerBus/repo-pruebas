<!DOCTYPE html>
<html lang="es">

<head>
      <title>Restablecer contraseña</title>

      <style>
            * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
                  font-family: 'DM Sans', sans-serif;
            }

            :root {
                  --purple: #A550BB;
                  --white: #fff;
                  --border: #d1d5db;
                  --error: #dc2626;
                  --success: #16a34a;
                  --gray: #6b7280;
            }

            body {
                  background: #A550BB;
                  min-height: 100vh;
                  display: flex;
                  justify-content: center;
                  align-items: center;
            }

            .card {
                  background: white;
                  width: 400px;
                  padding: 35px;
                  box-shadow: 0 4px 20px rgba(0, 0, 0, .15);
            }

            h1 {
                  text-align: center;
                  font-size: 24px;
                  margin-bottom: 8px;
                  color: #111827;
            }

            .subtitle {
                  text-align: center;
                  color: var(--gray);
                  font-size: 14px;
                  margin-bottom: 25px;
            }

            .field-group {
                  margin-bottom: 18px;
            }

            label {
                  display: block;
                  margin-bottom: 8px;
                  font-size: 14px;
                  font-weight: 500;
            }

            .field {
                  position: relative;
            }

            input {
                  width: 100%;
                  padding: 12px 40px 12px 12px;
                  border: 1.5px solid var(--border);
                  background: #f9fafb;
                  font-size: 14px;
                  outline: none;
            }

            input:focus {
                  border-color: var(--purple);
            }

            .error {
                  border-color: var(--error) !important;
            }

            .success {
                  border-color: var(--success) !important;
            }

            .toggle {
                  position: absolute;
                  right: 10px;
                  top: 50%;
                  transform: translateY(-50%);
                  border: none;
                  background: none;
                  cursor: pointer;
            }

            .error-text {
                  font-size: 12px;
                  color: var(--error);
                  margin-top: 5px;
                  display: none;
            }

            .requirements {
                  border: 1px solid var(--border);
                  padding: 12px;
                  margin-bottom: 20px;
                  background: #fafafa;
            }

            .requirements p {
                  font-size: 13px;
                  margin-bottom: 7px;
                  color: var(--gray);
            }

            .ok {
                  color: var(--success) !important;
            }

            .strength {
                  margin: 12px 0;
                  font-size: 13px;
                  font-weight: 700;
            }

            button.main-btn {
                  width: 100%;
                  padding: 14px;
                  border: none;
                  background: #d1d5db;
                  color: white;
                  font-size: 15px;
                  font-weight: 700;
                  cursor: not-allowed;
            }

            button.main-btn.active {
                  background: var(--purple);
                  cursor: pointer;
            }

            button.main-btn.active:hover {
                  opacity: .9;
            }
      </style>
</head>

<body>

      <div class="card">
            <h1>Restablecer contraseña</h1>

            <div class="field-group">
                  <label>Nueva contraseña</label>
                  <div class="field">
                        <input id="newPass" type="password" oninput="validatePassword()">
                        <button class="toggle" onclick="toggle('newPass')">👁</button>
                  </div>
            </div>

            <div class="strength" id="strengthText">Fortaleza: -</div>

            <div class="requirements">
                  <p id="req1">• Mínimo 12 caracteres</p>
                  <p id="req2">• Incluye mayúsculas y minúsculas</p>
                  <p id="req3">• Incluye al menos 3 números</p>
                  <p id="req4">• Incluye al menos 3 caracteres especiales</p>
                  <p id="req5">• No permite secuenciales</p>
                  <p id="req6">• No incluye nombre de usuario</p>
                  <p id="req7">• No reutiliza últimas 3 contraseñas</p>
            </div>

            <div class="field-group">
                  <label>Confirmar contraseña</label>
                  <div class="field">
                        <input id="confirmPass" type="password" oninput="validatePassword()">
                        <button class="toggle" onclick="toggle('confirmPass')">👁</button>
                  </div>
                  <p class="error-text" id="matchError">Las contraseñas no coinciden</p>
            </div>

            <button id="updateBtn" class="main-btn" disabled onclick="updatePassword()">
                  Actualizar contraseña
            </button>
      </div>

      <script>
            const lastPasswords = ["Pass123!!!", "Admin456@@@", "Empresa789###"];
            const username = "empleado123";

            function toggle(id) {
                  const input = document.getElementById(id);
                  input.type = input.type === "password" ? "text" : "password";
            }

            function hasSequential(str) {
                  return /123|234|345|456|567|678|789|abc|bcd|cde/i.test(str);
            }

            function mark(id, condition) {
                  document.getElementById(id).classList.toggle("ok", condition);
            }

            function validatePassword() {
                  const pass = document.getElementById("newPass").value;
                  const confirm = document.getElementById("confirmPass").value;

                  const r1 = pass.length >= 12;
                  const r2 = /[A-Z]/.test(pass) && /[a-z]/.test(pass);
                  const r3 = (pass.match(/[0-9]/g) || []).length >= 3;
                  const r4 = (pass.match(/[^A-Za-z0-9]/g) || []).length >= 3;
                  const r5 = !hasSequential(pass);
                  const r6 = !pass.toLowerCase().includes(username.toLowerCase());
                  const r7 = !lastPasswords.includes(pass);

                  mark("req1", r1);
                  mark("req2", r2);
                  mark("req3", r3);
                  mark("req4", r4);
                  mark("req5", r5);
                  mark("req6", r6);
                  mark("req7", r7);

                  let score = [r1, r2, r3, r4, r5, r6, r7].filter(Boolean).length;
                  const strength = document.getElementById("strengthText");

                  if (score <= 3) strength.textContent = "Fortaleza: Baja";
                  else if (score <= 5) strength.textContent = "Fortaleza: Media";
                  else strength.textContent = "Fortaleza: Alta";

                  const matchError = document.getElementById("matchError");
                  const confirmInput = document.getElementById("confirmPass");

                  let match = pass === confirm && confirm !== "";

                  if (confirm && !match) {
                        matchError.style.display = "block";
                        confirmInput.classList.add("error");
                  } else {
                        matchError.style.display = "none";
                        confirmInput.classList.remove("error");
                        if (match) confirmInput.classList.add("success");
                  }

                  const valid = r1 && r2 && r3 && r4 && r5 && r6 && r7 && match;
                  const btn = document.getElementById("updateBtn");

                  btn.disabled = !valid;
                  btn.classList.toggle("active", valid);
            }

            function updatePassword() {
                  alert("Contraseña actualizada correctamente");
                  window.location.href = "login.html";
            }
      </script>

</body>

</html>
