<!DOCTYPE html>
<html lang="es">

<head>
      <title>Restablecer contraseña</title>
      <link rel="stylesheet" href="../CSS/restablecer.css">

</head>

<body>

      <div class="contenedor">
            <h1>Restablecer contraseña</h1>

            <div class="grupo">
                  <label>Nueva contraseña</label>
                  <div class="campo">
                        <input id="newPass" type="password" oninput="validatePassword()"> <!--//checar el on input-->
                        <button class="toggle" onclick="toggle('newPass')">👁</button>
                        <!--//"" "" onclick cambiar class-->
                  </div>
            </div>

            <div class="fortaleza" id="strengthText">Fortaleza: -</div> <!--cambiar el nom del id-->

            <div class="requerimientos">
                  <p id="req1">• Mínimo 12 caracteres</p>
                  <p id="req2">• Incluye mayúsculas y minúsculas</p>
                  <p id="req3">• Incluye al menos 3 números</p>
                  <p id="req4">• Incluye al menos 3 caracteres especiales</p>
                  <p id="req5">• No permite secuenciales</p>
                  <p id="req6">• No incluye nombre de usuario</p>
                  <p id="req7">• No reutiliza últimas 3 contraseñas</p>
            </div>

            <div class="grupo">
                  <label>Confirmar contraseña</label>
                  <div class="campo">
                        <input id="confirmPass" type="password" oninput="validatePassword()">
                        <!--//cambiar nom id revisar oninput-->
                        <button class="toggle" onclick="toggle('confirmPass')">👁</button> <!--//cambiar class-->
                  </div>
                  <p class="error-text" id="matchError">Las contraseñas no coinciden</p>
            </div>

            <button id="updateBtn" class="main-btn" disabled onclick="updatePassword()">
                  Actualizar contraseña
            </button>
      </div>

      <script>
            const lastPasswords = ["Pass123!!!", "Admin456@@@", "Empresa789###"];
            const username = "empleado123";

            function toggle(id) {
                  const input = document.getElementById(id);
                  input.type = input.type === "password" ? "text" : "password";
            }

            function hasSequential(str) {
                  return /123|234|345|456|567|678|789|abc|bcd|cde/i.test(str);
            }

            function mark(id, condition) {
                  document.getElementById(id).classList.toggle("ok", condition);
            }

            function validatePassword() {
                  const pass = document.getElementById("newPass").value;
                  const confirm = document.getElementById("confirmPass").value;

                  const r1 = pass.length >= 12;
                  const r2 = /[A-Z]/.test(pass) && /[a-z]/.test(pass);
                  const r3 = (pass.match(/[0-9]/g) || []).length >= 3;
                  const r4 = (pass.match(/[^A-Za-z0-9]/g) || []).length >= 3;
                  const r5 = !hasSequential(pass);
                  const r6 = !pass.toLowerCase().includes(username.toLowerCase());
                  const r7 = !lastPasswords.includes(pass);

                  mark("req1", r1);
                  mark("req2", r2);
                  mark("req3", r3);
                  mark("req4", r4);
                  mark("req5", r5);
                  mark("req6", r6);
                  mark("req7", r7);

                  let score = [r1, r2, r3, r4, r5, r6, r7].filter(Boolean).length;
                  const strength = document.getElementById("strengthText");

                  if (score <= 3) strength.textContent = "Fortaleza: Baja";
                  else if (score <= 5) strength.textContent = "Fortaleza: Media";
                  else strength.textContent = "Fortaleza: Alta";

                  const matchError = document.getElementById("matchError");
                  const confirmInput = document.getElementById("confirmPass");

                  let match = pass === confirm && confirm !== "";

                  if (confirm && !match) {
                        matchError.style.display = "block";
                        confirmInput.classList.add("error");
                  } else {
                        matchError.style.display = "none";
                        confirmInput.classList.remove("error");
                        if (match) confirmInput.classList.add("success");
                  }

                  const valid = r1 && r2 && r3 && r4 && r5 && r6 && r7 && match;
                  const btn = document.getElementById("updateBtn");

                  btn.disabled = !valid;
                  btn.classList.toggle("active", valid);
            }

            function updatePassword() {
                  alert("Contraseña actualizada correctamente");
                  window.location.href = "login.html";
            }
      </script>

</body>

</html>
